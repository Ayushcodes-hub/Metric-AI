services:
  - type: web
    name: metric-discovery-engine
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: metric-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false # Add this value in your Render dashboard environment variables

databases:
  - name: metric-db
    plan: free
